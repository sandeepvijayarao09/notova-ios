name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: SwiftLint
        run: |
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint lint --strict

      - name: Run Swift package tests
        run: |
          set -e
          for pkg in NotovaCore Transcription AISummary ModelManagement Integrations Persistence Keychain DesignSystem; do
            if [ -d "Packages/$pkg/Tests" ]; then
              echo "== swift test: $pkg =="
              ( cd "Packages/$pkg" && swift test )
            fi
          done

      - name: iOS app unit tests
        run: |
          set -e
          # Pick the first available iPhone simulator on the runner (robust across Xcode versions).
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[^(]*' | head -1 | xargs)
          echo "Using iOS Simulator: ${DEVICE:?no iPhone simulator available}"
          # Unit tests only. The NotovaUITests (XCUITest) target is excluded from CI because
          # UI automation on the hosted simulator intermittently hangs; run it locally on an idle
          # machine (`make test` / Xcode). Logic is covered by the eight SwiftPM package suites
          # above plus NotovaTests here.
          xcodebuild test \
            -project Notova.xcodeproj \
            -scheme Notova \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -only-testing:NotovaTests

      - name: macOS app build + tests
        run: |
          xcodebuild test \
            -project Notova.xcodeproj \
            -scheme NotovaMac \
            -destination 'platform=macOS'
