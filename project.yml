name: Notova
options:
  bundleIdPrefix: com.notova
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  NotovaCore:
    path: Packages/NotovaCore
  AudioCapture:
    path: Packages/AudioCapture
  Transcription:
    path: Packages/Transcription
  AISummary:
    path: Packages/AISummary
  ModelManagement:
    path: Packages/ModelManagement
  Persistence:
    path: Packages/Persistence
  Integrations:
    path: Packages/Integrations
  DesignSystem:
    path: Packages/DesignSystem
  Keychain:
    path: Packages/Keychain

targets:
  Notova:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Resources
        optional: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Notova
        # Export compliance: Notova uses only standard OS encryption (HTTPS / Keychain), exempt
        # under US EAR, so App Store Connect won't block each submission for an encryption review.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Notova needs microphone access to record audio for on-device transcription and summarization."
        NSSpeechRecognitionUsageDescription: "Notova uses speech recognition to transcribe your recordings entirely on your device."
        CFBundleURLTypes:
          - CFBundleURLName: com.notova.app.oauth
            CFBundleURLSchemes:
              - notova
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notova.app
        PRODUCT_NAME: Notova
        INFOPLIST_KEY_CFBundleDisplayName: Notova
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: NotovaCore
      - package: AudioCapture
      - package: Transcription
      - package: AISummary
      - package: ModelManagement
      - package: Persistence
      - package: Integrations
      - package: DesignSystem
      - package: Keychain

  NotovaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppTests
    dependencies:
      - target: Notova
      - package: NotovaCore
      - package: ModelManagement
      - package: Transcription
      - package: AISummary
      - package: Persistence
      - package: Integrations
      - package: Keychain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notova.app.tests
        GENERATE_INFOPLIST_FILE: YES

  NotovaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppUITests
    dependencies:
      - target: Notova
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notova.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Notova

  # Native macOS app. Reuses the NotovaCore package (models, pipeline, on-device AI seams);
  # only the SwiftUI UI and the audio/file plumbing are macOS-specific.
  NotovaMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacApp
    settings:
      base:
        # Product name is left as the target name (NotovaMac.app) so the hosted test target's
        # auto TEST_HOST path resolves; the user-facing name is set via CFBundleDisplayName.
        PRODUCT_BUNDLE_IDENTIFIER: com.notova.mac
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Ad-hoc signing so the app launches locally (incl. hosting the unit tests).
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        INFOPLIST_KEY_CFBundleDisplayName: Notova
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Notova needs microphone access to record audio for on-device transcription and summarization."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Notova uses speech recognition to transcribe your recordings entirely on your device."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # App Sandbox (required for the Mac App Store) + Hardened Runtime (for notarized Developer ID
        # builds). Entitlements grant mic, user-selected file read, and outbound network only.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: MacApp/NotovaMac.entitlements
    dependencies:
      # Real on-device engines (mirrors the iOS app's AppContainer). Without these the Mac app
      # fell back to NotovaCore's StubTranscriber/StubSummarizer, which emit canned placeholder
      # text and ignore the recorded audio.
      - package: NotovaCore
      - package: Transcription
      - package: AISummary
      - package: ModelManagement

  NotovaMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacAppTests
    dependencies:
      - target: NotovaMac
      - package: NotovaCore
      # Resolver types (ResolvingTranscriber / ResolvingSummarizer) for deterministic engine tests.
      - package: Transcription
      - package: AISummary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notova.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"

schemes:
  Notova:
    build:
      targets:
        Notova: all
        NotovaTests: [test]
        NotovaUITests: [test]
    test:
      targets:
        - NotovaTests
        - NotovaUITests
      gatherCoverageData: true

  NotovaMac:
    build:
      targets:
        NotovaMac: all
        NotovaMacTests: [test]
    test:
      targets:
        - NotovaMacTests
      gatherCoverageData: true
